<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f78166;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ee787;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7ee787;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d2a8ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d2a8ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="glow5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffa657;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffa657;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="glow6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#79c0ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="glow7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7b72;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ff7b72;stop-opacity:0" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
    <filter id="blur2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
    </filter>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#58a6ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Central problem node - glowing -->
  <circle cx="200" cy="200" r="30" fill="#0d1117" stroke="#58a6ff" stroke-width="2" filter="url(#blur1)" />
  <circle cx="200" cy="200" r="25" fill="#0d1117" stroke="#58a6ff" stroke-width="2" />
  <circle cx="200" cy="200" r="4" fill="#58a6ff" />

  <!-- Divergent branches - scattered lines from center -->
  <!-- Branch 1 - blue, goes to top -->
  <path d="M 225 185 Q 350 80 480 60" stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.7" />
  <circle cx="480" cy="60" r="6" fill="#58a6ff" opacity="0.8" />
  <path d="M 486 60 Q 530 55 580 70" stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.4" />
  <circle cx="580" cy="70" r="3" fill="#58a6ff" opacity="0.5" />

  <!-- Branch 2 - orange, upper -->
  <path d="M 228 190 Q 340 120 470 110" stroke="#f78166" stroke-width="1.5" fill="none" opacity="0.7" />
  <circle cx="470" cy="110" r="6" fill="#f78166" opacity="0.8" />
  <path d="M 476 108 Q 520 90 570 105" stroke="#f78166" stroke-width="1" fill="none" opacity="0.4" />
  <circle cx="570" cy="105" r="3" fill="#f78166" opacity="0.5" />
  <path d="M 476 112 Q 540 130 590 120" stroke="#f78166" stroke-width="1" fill="none" opacity="0.3" />
  <circle cx="590" cy="120" r="2.5" fill="#f78166" opacity="0.4" />

  <!-- Branch 3 - green, middle upper -->
  <path d="M 228 195 Q 360 160 490 165" stroke="#7ee787" stroke-width="1.5" fill="none" opacity="0.7" />
  <circle cx="490" cy="165" r="6" fill="#7ee787" opacity="0.8" />
  <path d="M 496 163 Q 550 140 610 155" stroke="#7ee787" stroke-width="1" fill="none" opacity="0.4" />
  <circle cx="610" cy="155" r="3" fill="#7ee787" opacity="0.5" />

  <!-- Branch 4 - purple, middle -->
  <path d="M 225 205 Q 380 200 500 210" stroke="#d2a8ff" stroke-width="1.5" fill="none" opacity="0.7" />
  <circle cx="500" cy="210" r="6" fill="#d2a8ff" opacity="0.8" />
  <path d="M 506 208 Q 560 195 620 205" stroke="#d2a8ff" stroke-width="1" fill="none" opacity="0.4" />
  <circle cx="620" cy="205" r="3" fill="#d2a8ff" opacity="0.5" />
  <path d="M 506 212 Q 550 225 605 218" stroke="#d2a8ff" stroke-width="1" fill="none" opacity="0.3" />
  <circle cx="605" cy="218" r="2.5" fill="#d2a8ff" opacity="0.4" />

  <!-- Branch 5 - amber, middle lower -->
  <path d="M 228 210 Q 350 250 480 260" stroke="#ffa657" stroke-width="1.5" fill="none" opacity="0.7" />
  <circle cx="480" cy="260" r="6" fill="#ffa657" opacity="0.8" />
  <path d="M 486 258 Q 540 240 590 255" stroke="#ffa657" stroke-width="1" fill="none" opacity="0.4" />
  <circle cx="590" cy="255" r="3" fill="#ffa657" opacity="0.5" />

  <!-- Branch 6 - light blue, lower -->
  <path d="M 225 215 Q 330 290 460 310" stroke="#79c0ff" stroke-width="1.5" fill="none" opacity="0.6" />
  <circle cx="460" cy="310" r="5" fill="#79c0ff" opacity="0.6" />

  <!-- Branch 7 - red, bottom - marked as trap -->
  <path d="M 220 220 Q 310 330 440 350" stroke="#ff7b72" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="6,4" />
  <circle cx="440" cy="350" r="5" fill="#ff7b72" opacity="0.5" />
  <text x="455" y="355" fill="#ff7b72" font-family="monospace" font-size="10" opacity="0.6">trap</text>

  <!-- Convergence zone - the focus funnel -->
  <g opacity="0.08">
    <rect x="650" y="100" width="200" height="200" rx="10" fill="#58a6ff" filter="url(#softglow)" />
  </g>

  <!-- Converging lines into focus zone -->
  <path d="M 580 70 Q 650 120 720 160" stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M 590 120 Q 650 140 720 165" stroke="#f78166" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M 610 155 Q 660 158 720 170" stroke="#7ee787" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 620 205 Q 670 195 720 185" stroke="#d2a8ff" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 590 255 Q 660 230 720 200" stroke="#ffa657" stroke-width="1" fill="none" opacity="0.5" />

  <!-- Focus nodes - the survivors -->
  <circle cx="740" cy="165" r="8" fill="#0d1117" stroke="#7ee787" stroke-width="2" />
  <circle cx="740" cy="165" r="3" fill="#7ee787" />
  <circle cx="740" cy="190" r="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2" />
  <circle cx="740" cy="190" r="3" fill="#d2a8ff" />
  <circle cx="740" cy="215" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2" />
  <circle cx="740" cy="215" r="3" fill="#58a6ff" />

  <!-- Deepened output lines -->
  <path d="M 748 165 Q 800 150 850 160" stroke="#7ee787" stroke-width="1.5" fill="none" opacity="0.7" />
  <path d="M 748 190 Q 800 190 850 185" stroke="#d2a8ff" stroke-width="1.5" fill="none" opacity="0.7" />
  <path d="M 748 215 Q 800 225 850 210" stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.7" />

  <!-- Final output node -->
  <circle cx="870" cy="185" r="12" fill="#0d1117" stroke="#e6edf3" stroke-width="2" />
  <circle cx="870" cy="185" r="5" fill="#e6edf3" opacity="0.8" />

  <!-- Title text -->
  <text x="940" y="155" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">ADHD</text>
  <text x="940" y="205" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="300" letter-spacing="-1">Flow</text>
  <text x="940" y="235" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">scatter first, then focus</text>

  <!-- Phase labels -->
  <text x="170" y="260" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">PROBLEM</text>
  <text x="400" y="30" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">DIVERGE</text>
  <text x="610" y="30" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">SCORE</text>
  <text x="740" y="130" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">DEEPEN</text>
  <text x="870" y="220" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">OUTPUT</text>
</svg>
